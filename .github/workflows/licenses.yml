name: Licenses

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-check:
    name: License declarations
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check GPLv3 text and root MATLAB SPDX headers
        run: python3 .github/scripts/check_licenses.py

  scancode:
    name: ScanCode report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install ScanCode
        # Pluggy 1.7 breaks PluginCode: https://github.com/aboutcode-org/plugincode/issues/14
        run: python -m pip install scancode-toolkit==32.5.0 pluggy==1.6.0
      - name: Scan tracked files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scancode-source" "$RUNNER_TEMP/scancode-report"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scancode-source"
          scancode --license --copyright --license-text --strip-root --processes 2 \
            --json-pp "$RUNNER_TEMP/scancode-report/scancode.json" \
            --html "$RUNNER_TEMP/scancode-report/scancode.html" \
            "$RUNNER_TEMP/scancode-source"
      - name: Upload license findings
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scancode-report
          path: ${{ runner.temp }}/scancode-report/
          if-no-files-found: error
          retention-days: 30
